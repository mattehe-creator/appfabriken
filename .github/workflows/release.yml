# Bygger release-varianten av Garantivalvet (R8 krymper koden) för publicering i Play.
# Körs för hand (Actions > Release > Run workflow). Ändras bara av Claude (CLAUDE.md punkt 11).
#
# Ger två saker:
#  1. En osignerad AAB, mapping.txt och ett test-APK (felsökningsnyckel) som artefakt under körningen (Actions,
#     sparas 30 dagar). Test-APK:n är ingen release: den vanliga APK:n för test är alltid senaste-main.
#     Play-nyckeln finns bara hos Mattias och i Play App Signing och ligger aldrig här: Mattias signerar AAB:n
#     själv (se garantivalvet/butik/PUBLICERA.md).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Tester
        run: gradle --no-daemon testDebugUnitTest

      - name: Signeringsnyckel (felsökning)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 saknas. Test-APK:n kan inte installeras över ett tidigare bygge."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Bygg release (APK för test och AAB)
        run: gradle --no-daemon :garantivalvet:assembleRelease :garantivalvet:bundleRelease -PsigneraMedDebug

      - name: Kontrollera behörigheter i release-APK:n
        run: |
          apk=$(ls garantivalvet/build/outputs/apk/release/*.apk | head -1)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$aapt2" dump permissions "$apk" | tee behorigheter.txt
          if grep -q "INTERNET" behorigheter.txt; then
            echo "::error::Release-APK:n begär INTERNET. Det får den inte göra (CLAUDE.md punkt 5)."
            exit 1
          fi
          if grep -q "ACCESS_NETWORK_STATE" behorigheter.txt; then
            echo "::error::Release-APK:n begär ACCESS_NETWORK_STATE."
            exit 1
          fi
          "$aapt2" dump badging "$apk" | grep -E "package:|targetSdkVersion|sdkVersion"

      - name: Samla filer
        run: |
          mkdir -p ut
          kort=${GITHUB_SHA::7}
          cp garantivalvet/build/outputs/apk/release/*.apk "ut/garantivalvet-release-test-${kort}.apk"
          cp garantivalvet/build/outputs/bundle/release/*.aab "ut/garantivalvet-${kort}-osignerad.aab"
          cp garantivalvet/build/outputs/mapping/release/mapping.txt "ut/mapping-${kort}.txt"
          ls -la ut

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.sha }}
          path: ut/*
          retention-days: 30

      # Ingen separat GitHub-release: Mattias ska bara ha en APK att installera (senaste-main). En gammal release-test
      # från tidigare körningar tas bort.
      - name: Ta bort gamla release-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete release-test --cleanup-tag --yes 2>/dev/null || echo "Ingen release-test att ta bort."
