# Bygger release-varianten av Garantivalvet (R8 krymper koden) för publicering i Play.
# Körs för hand (Actions > Release > Run workflow). Ändras bara av Claude (CLAUDE.md punkt 11).
#
# Ger två saker:
#  1. Ett test-APK (signerat med felsökningsnyckeln) som läggs i releasen "release-test", så att Mattias kan
#     installera och prova exakt den krympta koden på telefonen innan något skickas till Play.
#  2. En osignerad AAB och mapping.txt som artefakt. Play-nyckeln finns bara hos Mattias och i Play App Signing
#     och ligger aldrig här: Mattias signerar AAB:n själv (se garantivalvet/butik/PUBLICERA.md).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Tester
        run: gradle --no-daemon testDebugUnitTest

      - name: Signeringsnyckel (felsökning)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 saknas. Test-APK:n kan inte installeras över ett tidigare bygge."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Bygg release (APK för test och AAB)
        run: gradle --no-daemon :garantivalvet:assembleRelease :garantivalvet:bundleRelease -PsigneraMedDebug

      - name: Kontrollera behörigheter i release-APK:n
        run: |
          apk=$(ls garantivalvet/build/outputs/apk/release/*.apk | head -1)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$aapt2" dump permissions "$apk" | tee behorigheter.txt
          if grep -q "INTERNET" behorigheter.txt; then
            echo "::error::Release-APK:n begär INTERNET. Det får den inte göra (CLAUDE.md punkt 5)."
            exit 1
          fi
          if grep -q "ACCESS_NETWORK_STATE" behorigheter.txt; then
            echo "::error::Release-APK:n begär ACCESS_NETWORK_STATE."
            exit 1
          fi
          "$aapt2" dump badging "$apk" | grep -E "package:|targetSdkVersion|sdkVersion"

      - name: Samla filer
        run: |
          mkdir -p ut
          kort=${GITHUB_SHA::7}
          cp garantivalvet/build/outputs/apk/release/*.apk "ut/garantivalvet-release-test-${kort}.apk"
          cp garantivalvet/build/outputs/bundle/release/*.aab "ut/garantivalvet-${kort}-osignerad.aab"
          cp garantivalvet/build/outputs/mapping/release/mapping.txt "ut/mapping-${kort}.txt"
          ls -la ut

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.sha }}
          path: ut/*
          retention-days: 30

      - name: Release release-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          noter="Release-bygge (R8) av ${GITHUB_SHA::7}, byggd $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M'). Test-APK signerad med felsökningsnyckeln; AAB:n är osignerad."
          if ! gh release view release-test >/dev/null 2>&1; then
            gh release create release-test --prerelease --title "Release-test" --notes "$noter" --target "$GITHUB_SHA"
          else
            gh release edit release-test --notes "$noter"
          fi
          for gammal in $(gh release view release-test --json assets --jq '.assets[].name'); do
            gh release delete-asset release-test "$gammal" --yes
          done
          gh release upload release-test ut/*.apk ut/*.aab ut/mapping-*.txt --clobber
