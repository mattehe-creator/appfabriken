# Genererar om butikens skärmbilder (Roborazzi) på vald gren och checkar in PNG-filerna där.
# Körs för hand (Actions > Skärmbilder > Run workflow, välj gren). Ändras bara av Claude (CLAUDE.md punkt 11).
name: Skärmbilder

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Appmodul (garantivalvet, husloggen, flextid)"
        required: true
        default: garantivalvet
        type: choice
        options: [garantivalvet, husloggen, flextid]

permissions:
  contents: write

concurrency:
  group: skarmbilder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skarmbilder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Generera skärmbilder
        run: gradle --no-daemon :${{ inputs.app }}:recordRoborazziDebug

      - name: Checka in ändrade bilder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.app }}/butik
          if git diff --cached --quiet; then
            echo "::notice::Inga bilder ändrades."
            exit 0
          fi
          git commit -m "Omgenererade butiksskärmbilder för ${{ inputs.app }} (workflow Skärmbilder)"
          git pull --rebase
          git push
